server.port=${PORT:8080}

# Optional local file with your secrets (key + DB password). Not committed to Git.
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-live-preview}
